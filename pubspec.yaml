name: sanayi_servis_app
description: "Sanayi Servis — B2C automotive service marketplace (Provider App)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.3

  # HTTP
  dio: ^5.7.0

  # Secure storage
  flutter_secure_storage: ^9.2.4

  # Image
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  google_maps_flutter: ^2.9.0

  # File
  file_picker: ^8.0.7

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.1
  badges: ^3.1.2
  timeago: ^3.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  custom_lint: ^0.7.4
  riverpod_lint: ^2.6.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1E293B"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/

dependency_overrides:
  sqflite_android: 2.4.1

